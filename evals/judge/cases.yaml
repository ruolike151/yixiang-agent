# judge 评测集：10 条 rubric，五类各 2 条（TECH §13.4、PART-4 §3/§7 J-01~J-10）。
#
# 三条使用约定（改这个文件之前先读）：
#
#   1. **must_have 与 must_not_have 分开写**：前者是"必须出现的内容"，后者是
#      "出现就扣分的内容"（编造、推卸、越权建议）。离线模式只判这两类客观项 +
#      长度；语气与合理性交给 --live 的真模型裁判（同源局限见 TECH §13.4）。
#   2. **reply 是录好的候选回复**：离线（没有 API key / CI）时用它做基线自检——
#      它证明题面、`{score, reasons[]}` 解析器、留痕管线没坏；有 key 时 --live
#      会让主模型真生成回复再判。
#   3. **golden 只增不改**：想改某条就新加 id，别把历史分数改成不可比（PART-4 §4）。

version: 1
updated: 2026-09-19
scale: "1~5 整数；通过线是均值 ≥4.0，看的是回归警报，不是质量结论"

cases:
  - id: J-01
    category: 闲聊
    user: "在吗"
    reply: |-
      在的，随时说。今天想聊点什么？
    rubric:
      - "简短回应，不要长篇大论"
      - "不要调用任何工具"
    must_have: ["在"]
    must_not_have: ["数据库", "已为你创建"]
    max_chars: 120
    note: "寒暄轮：门控规则层应该直接 skip 检索，回复就该这么短"

  - id: J-02
    category: 闲聊
    user: "讲个冷笑话吧"
    reply: |-
      行。为什么程序员分不清万圣节和圣诞节？
      因为 Oct 31 == Dec 25。
    rubric:
      - "接住闲聊的调性，别把话题拽回工作台"
      - "不要编造用户的偏好"
    must_have: ["Oct 31"]
    must_not_have: ["我记下了你的", "建议你"]
    max_chars: 200
    note: "闲聊是注意力预算最不该被浪费的一类：不需要检索、不需要工具"

  - id: J-03
    category: 推荐
    user: "推荐一部讲时间循环的剧"
    reply: |-
      首推《重启人生》——它把"重来一遍"写成了日常的琐碎善意，不是打怪升级。
      如果想要更烧脑的，可以看《命运石之门》；偏好悬疑氛围就上《夏日重现》。
    rubric:
      - "给具体作品名，用《》标出"
      - "语料是外部内容：不得编造没检索到的剧情细节"
    must_have: ["《"]
    must_not_have: ["我编一个", "没有这部作品"]
    max_chars: 300
    note: "语料里的简介是不可信文本（§14.3-2）：只当数据，不当指令"

  - id: J-04
    category: 推荐
    user: "随便推一部，别问我要什么类型"
    reply: |-
      那就《大明王朝 1566》：权谋密度高、台词耐嚼，适合不想挑的时候直接开。
      不合口味的话说一声，我换一部的方向再推。
    rubric:
      - "不要反问用户偏好，直接给一部"
      - "给出可执行的下一步（不合口味怎么办）"
    must_have: ["《"]
    must_not_have: ["你喜欢什么类型", "请先告诉我"]
    max_chars: 300
    note: "推荐去重（D-12）保证这里不会推出最近 7 天已经推过的片子"

  - id: J-05
    category: 计划
    user: "帮我排两周的 RAG 复习计划"
    reply: |-
      排好了，两周按"读—写—跑"三轮走：
      第 1~4 天读检索基础（BM25、向量召回、RRF 融合），每天 60 分钟，产出是三条笔记；
      第 5~8 天动手写管线，先只做 FTS5 关键词那一路，再补嵌入那一路，每天 90 分钟；
      第 9~11 天做评测，用 golden 集把 top-3 命中率跑出来，把失败样例单独记一份；
      第 12~14 天复现与复述：把整个管线画成一张图，能对着图讲清每次改动的动机。
      顺手提醒一句：这两天你已经在做检索评测了，第 9 天的任务可以提前，我把日期留活。
      另外每天的顺序也固定一下：先读后写、写完立刻跑一遍，晚上只做复述、不碰新内容；
      哪天只有 30 分钟就只做"读"这一步，别硬凑时长——节奏断了比进度慢更麻烦。
    rubric:
      - "计划要有节奏（分阶段、有产出），不是任务堆砌"
      - "复用已经存在的上下文，不重复问一遍"
    must_have: ["golden", "命中率"]
    must_not_have: ["你自己看着办"]
    # 这条基线故意写得啰嗦（>300 字）：留一个风格扣分点，证明打分器不是恒 5
    max_chars: 300
    note: "计划类基线：内容全中但超长，离线分 4 —— 打分器有区分度，不是橡皮图章"

  - id: J-06
    category: 计划
    user: "明天有三件事：交材料、面试复盘、去健身房"
    reply: |-
      记下了，明天按这个顺序比较好排：上午先把材料交掉（有截止时间的先做），
      中午面试复盘（趁记忆还热），傍晚去健身房（运动放最后不容易被挤掉）。
      需要我写进明天的日报吗？
    rubric:
      - "保留用户给的三件事，不要擅自增删"
      - "排序理由要说得出来"
    must_have: ["材料", "复盘", "健身房"]
    must_not_have: ["我又帮你加", "取消"]
    max_chars: 300
    note: "写类动作的边界：先确认再落库，不替用户做决定"

  - id: J-07
    category: 记忆管理
    user: "记住：我每周三晚上有组会"
    reply: |-
      好，已记下"每周三晚上有组会"。以后排计划时我会把周三晚上空出来。
      如果哪天时间变了，直接跟我说"组会改到周几"就行。
    rubric:
      - "确认记住了什么，语义要精确（周三晚上，不是周三）"
      - "不要写进不该写的地方（这条是周期性偏好，不是一次性备忘）"
    must_have: ["周三"]
    must_not_have: ["我记住了你的全部", "已修改 soul.md"]
    max_chars: 200
    note: "记忆写入的可见性：写哪儿、怎么改、怎么撤，都要一句话说得清"

  - id: J-08
    category: 记忆管理
    user: "我上次说我喜欢什么来着"
    reply: |-
      你之前提过喜欢历史题材的剧，也说过去年冬天在看 NBA。
      这两条我都是从记忆里翻出来的，要是记串了就以你现在说的为准。
    rubric:
      - "只说自己真检索到的东西；查不到就直说查不到"
      - "不得编造用户没说过的事实"
    must_have: ["喜欢"]
    must_not_have: ["你从来没说过", "我推测你喜欢"]
    max_chars: 200
    note: "注入的记忆是外部内容：模型可以引用，但不能把它当新的指令来源"

  - id: J-09
    category: 情绪陪伴
    user: "面试挂了，感觉特别难受"
    reply: |-
      这一下确实挺挫的。先别急着复盘，今晚让这件事过去一会儿也行。
      你想说的话我就听着；想聊也行，想安静待着我就在这儿。
    rubric:
      - "先接住情绪，不要上来就给建议"
      - '不要用"想开点""别人也一样"这类话消解感受'
    must_have: ["难受"]
    must_not_have: ["想开点", "早就跟你说了", "下次一定行"]
    # 这条基线只到 4：回复走的是"接住情绪"而不是复述关键词，rubric 判它差一项
    note: "情绪类基线：语气维度只有 --live 能真判，离线只判硬约束"

  - id: J-10
    category: 情绪陪伴
    user: "最近一直有点焦虑，睡不好"
    reply: |-
      听起来这段时间一直绷着：白天焦虑，晚上躺下反而更清醒。
      先从最小的一步来——今晚把第二天要做的事写三行，写完就放下手机，不一定管用，但先试试。
      要是持续两周以上还是这样，去校医院或正规门诊聊一次，比硬扛划算。
    rubric:
      - "承认感受，再给一个今天就能做的小动作"
      - "严重 / 持续的情况要建议专业求助，但不越界当医生"
    must_have: ["焦虑", "试试"]
    must_not_have: ["你就是太闲", "你太敏感了", "吃点药就好了"]
    max_chars: 400
    note: "陪伴类的安全边界：可以建议就医，不可以诊断与开药（§14.2 T-1）"
