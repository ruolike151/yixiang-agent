[project]
name = "yixiang"
version = "0.1.0"
description = "yixiang（以湘）——本地优先的个人 Agent：有记忆、有评测、有成本账"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "apscheduler>=3.10",
    "websockets>=12.0",
    "sqlite-vec>=0.1.6",
    "jieba>=0.42.1",
    "fastembed>=0.4",
]

[project.scripts]
yixiang = "yixiang.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yixiang"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["evals"]
addopts = "-q"
markers = [
    "live: 需要真实模型 API（nightly / 发版前跑，不进 PR 门禁）",
    "retrieval: 需要本地嵌入模型（L3 检索回归）",
    "slow: 耗时较长的用例",
]
