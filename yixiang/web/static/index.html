<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>以湘 · 控制台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F172A'/%3E%3Cpath d='M9 21V11l7 10V11' stroke='%2322C55E' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主内容</a>

    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true" id="brand-mark"></span>
          <span class="brand-text">
            <strong>以湘 · 控制台</strong>
            <span id="brand-sub">本地测试前端</span>
          </span>
        </div>
        <dl class="status-strip" id="status-strip" aria-live="polite"></dl>
      </header>

      <nav class="sidebar" id="sidebar" aria-label="功能分区">
        <ul class="nav-list" id="nav-list"></ul>
        <div class="sidebar-foot">
          <p class="foot-line" id="foot-session">会话：加载中…</p>
          <p class="foot-line foot-dim" id="foot-paths"></p>
        </div>
      </nav>

      <main class="main" id="main" tabindex="-1">
        <p class="empty" role="status">正在连接本地服务…</p>
      </main>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script src="/app.js" defer></script>
  </body>
</html>
